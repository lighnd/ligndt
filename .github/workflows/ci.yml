name: CI

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master", "develop" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    container:
      image: ubuntu:24.04
      options: --user root
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "Ubuntu 24.04 (Clang 23, Release)"
            sanitizer: "none"
            build_type: "Release"

          - name: "Ubuntu 24.04 (Clang 23 + ASan)"
            sanitizer: "address"
            build_type: "Debug"

          - name: "Debian Bookworm Environment (Clang 23)"
            sanitizer: "none"
            build_type: "Release"

          - name: "Fedora Environment (Clang 23)"
            sanitizer: "none"
            build_type: "Release"

          - name: "Arch Linux Environment (Clang 23)"
            sanitizer: "none"
            build_type: "Release"

          - name: "AlmaLinux Environment (Clang 23)"
            sanitizer: "none"
            build_type: "Release"

          - name: "Rocky Linux Environment (Clang 23)"
            sanitizer: "none"
            build_type: "Release"

    steps:
      - name: Bootstrap Environment
        run: |
          apt-get update
          apt-get install -y git wget lsb-release software-properties-common gnupg sudo

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install LLVM / Clang 23
        run: |
          wget https://llvm.org
          chmod +x llvm.sh
          sudo ./llvm.sh 23 all
          sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-23 100
          sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-23 100
          sudo update-alternatives --install /usr/bin/lld lld /usr/bin/lld-23 100

      - name: Install Dependencies
        run: |
          sudo apt-get install -y ninja-build libomp-23-dev libboost-all-dev qt6-base-dev \
            libbenchmark-dev libhwy-dev libglm-dev libvulkan-dev ccache

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ github.job }}-${{ matrix.name }}

      - name: Configure CMake
        env:
          SAN_FLAG: ${{ matrix.sanitizer != 'none' && format('-fsanitize={0} -fno-omit-frame-pointer', matrix.sanitizer) || '' }}
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_C_COMPILER=clang-23 \
            -DCMAKE_CXX_COMPILER=clang++-23 \
            -DCMAKE_LINKER=lld-23 \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_C_FLAGS="$SAN_FLAG" \
            -DCMAKE_CXX_FLAGS="$SAN_FLAG" \
            -DCMAKE_EXE_LINKER_FLAGS="-fuse-ld=lld $SAN_FLAG" \
            -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Run tests
        run: ctest --test-dir build --output-on-failure --parallel 4
