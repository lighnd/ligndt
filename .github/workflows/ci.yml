name: CI

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master", "develop" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    container: ${{ matrix.container }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "Ubuntu 24.04 (Clang 23, Release)"
            sanitizer: "none"
            build_type: "Release"
            container: "ubuntu:24.04"

          - name: "Ubuntu 24.04 (Clang 23 + ASan)"
            sanitizer: "address"
            build_type: "Debug"
            container: "ubuntu:24.04"

          - name: "Debian Bookworm (Clang 23)"
            sanitizer: "none"
            build_type: "Release"
            container: "debian:bookworm"

          - name: "Fedora Latest (Clang)"
            sanitizer: "none"
            build_type: "Release"
            container: "fedora:latest"

          - name: "Arch Linux (Clang)"
            sanitizer: "none"
            build_type: "Release"
            container: "archlinux:latest"

          - name: "AlmaLinux 9 (Clang)"
            sanitizer: "none"
            build_type: "Release"
            container: "almalinux:9"

          - name: "Rocky Linux 9 (Clang)"
            sanitizer: "none"
            build_type: "Release"
            container: "rockylinux:9"

    steps:
      - name: Install git and ccache (Ubuntu / Debian containers)
        if: matrix.container == 'ubuntu:24.04' || matrix.container == 'debian:bookworm'
        run: |
          apt-get update
          apt-get install -y git ccache --no-install-recommends

      - name: Install git and ccache (Fedora container)
        if: startsWith(matrix.container, 'fedora')
        run: |
          dnf install -y git ccache

      - name: Install git and ccache (Arch container)
        if: startsWith(matrix.container, 'archlinux')
        run: |
          pacman -Sy --noconfirm git ccache

      - name: Install git and ccache (AlmaLinux / Rocky Linux containers)
        if: startsWith(matrix.container, 'almalinux') || startsWith(matrix.container, 'rockylinux')
        run: |
          dnf install -y epel-release || true
          dnf install -y git ccache

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install prerequisites (Ubuntu / Debian)
        if: matrix.container == 'ubuntu:24.04' || matrix.container == 'debian:bookworm'
        run: |
          apt-get update
          apt-get install -y wget lsb-release software-properties-common gnupg --no-install-recommends

      - name: Install LLVM / Clang 23 (Debian/Ubuntu)
        if: matrix.container == 'ubuntu:24.04' || matrix.container == 'debian:bookworm'
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          ./llvm.sh 23 all
          update-alternatives --install /usr/bin/clang clang /usr/bin/clang-23 100
          update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-23 100
          update-alternatives --install /usr/bin/lld lld /usr/bin/lld-23 100

      - name: Install dependencies (Ubuntu 24.04)
        if: matrix.container == 'ubuntu:24.04'
        run: |
          apt-get install -y ninja-build libomp-23-dev libboost-all-dev qt6-base-dev \
            libbenchmark-dev libhwy-dev libglm-dev libvulkan-dev

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ github.job }}-${{ matrix.name }}
          variant: sccache

      - name: Configure CMake
        env:
          SAN_FLAG: ${{ matrix.sanitizer != 'none' && format('-fsanitize={0} -fno-omit-frame-pointer', matrix.sanitizer) || '' }}
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_C_COMPILER=clang-23 \
            -DCMAKE_CXX_COMPILER=clang++-23 \
            -DCMAKE_LINKER=lld-23 \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_C_FLAGS="$SAN_FLAG" \
            -DCMAKE_CXX_FLAGS="$SAN_FLAG" \
            -DCMAKE_EXE_LINKER_FLAGS="-fuse-ld=lld $SAN_FLAG" \
            -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Run tests
        run: ctest --test-dir build --output-on-failure --parallel 4