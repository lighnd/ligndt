name: CI

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master", "develop" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "Ubuntu (Clang 23, Release)"
            container: null
            distro: "ubuntu"
            sanitizer: "none"
            build_type: "Release"

          - name: "Ubuntu (Clang 23 + ASan)"
            container: null
            distro: "ubuntu"
            sanitizer: "address"
            build_type: "Debug"

          - name: "Debian Bookworm (Clang 23, Release)"
            container: "debian:bookworm-slim"
            distro: "debian"
            sanitizer: "none"
            build_type: "Release"

          - name: "Debian Testing (Clang 23, Release)"
            container: "debian:testing-slim"
            distro: "debian"
            sanitizer: "none"
            build_type: "Release"

          - name: "Debian Sid (Clang 23, Release)"
            container: "debian:sid-slim"
            distro: "debian"
            sanitizer: "none"
            build_type: "Release"

          - name: "Fedora (Clang 23, Release)"
            container: "silkeh/clang:23"
            distro: "rhel-fedora"
            sanitizer: "none"
            build_type: "Release"

          - name: "Arch Linux (Clang 23, Release)"
            container: "silkeh/clang:23"
            distro: "arch"
            sanitizer: "none"
            build_type: "Release"

          - name: "AlmaLinux 9 (Clang 23, Release)"
            container: "silkeh/clang:23"
            distro: "rhel-fedora"
            sanitizer: "none"
            build_type: "Release"

          - name: "Rocky Linux 9 (Clang 23, Release)"
            container: "silkeh/clang:23"
            distro: "rhel-fedora"
            sanitizer: "none"
            build_type: "Release"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install LLVM / Clang 23 (Debian & Ubuntu)
        if: matrix.distro == 'ubuntu' || matrix.distro == 'debian'
        run: |
          apt-get update
          apt-get install -y wget lsb-release software-properties-common gnupg sudo git
          wget https://llvm.org
          chmod +x llvm.sh
          sudo ./llvm.sh 23 all
          sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-23 100
          sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-23 100
          sudo update-alternatives --install /usr/bin/lld lld /usr/bin/lld-23 100

      - name: Install Dependencies (Ubuntu & Debian)
        if: matrix.distro == 'ubuntu' || matrix.distro == 'debian'
        run: |
          sudo apt-get install -y ninja-build libomp-23-dev libboost-all-dev qt6-base-dev \
            libbenchmark-dev libhwy-dev libglm-dev libvulkan-dev ccache

      - name: Install Dependencies (RHEL, Fedora, Arch)
        if: matrix.distro == 'rhel-fedora' || matrix.distro == 'arch'
        run: |
          apt-get update
          apt-get install -y ninja-build libboost-all-dev qt6-base-dev \
            libbenchmark-dev libhwy-dev libglm-dev libvulkan-dev ccache libomp-23-dev

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ github.job }}-${{ matrix.name }}

      - name: Configure CMake
        env:
          SAN_FLAG: ${{ matrix.sanitizer != 'none' && format('-fsanitize={0} -fno-omit-frame-pointer', matrix.sanitizer) || '' }}
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_C_COMPILER=clang-23 \
            -DCMAKE_CXX_COMPILER=clang++-23 \
            -DCMAKE_LINKER=lld-23 \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_C_FLAGS="$SAN_FLAG" \
            -DCMAKE_CXX_FLAGS="$SAN_FLAG" \
            -DCMAKE_EXE_LINKER_FLAGS="-fuse-ld=lld $SAN_FLAG" \
            -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Run tests
        run: ctest --test-dir build --output-on-failure --parallel 4
