name: CI

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master", "develop" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    container: ${{ matrix.container }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "Ubuntu 24.04 Clang 23 Release"
            sanitizer: "none"
            build_type: "Release"
            container: "ubuntu:24.04"

          - name: "Ubuntu 24.04 Clang 23 ASan"
            sanitizer: "address"
            build_type: "Debug"
            container: "ubuntu:24.04"

          - name: "Debian Bookworm Clang 23"
            sanitizer: "none"
            build_type: "Release"
            container: "debian:bookworm"

    steps:
      - name: Install system tools
        run: |
          apt-get update
          apt-get install -y git ca-certificates ccache cmake ninja-build --no-install-recommends

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install prerequisites
        run: |
          apt-get install -y wget lsb-release software-properties-common gnupg --no-install-recommends

      - name: Install LLVM / Clang 23
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          ./llvm.sh 23 all

      - name: Install dependencies (Ubuntu specific)
        if: matrix.container == 'ubuntu:24.04'
        run: |
          apt-get install -y libomp-23-dev libboost-all-dev qt6-base-dev \
            libbenchmark-dev libhwy-dev libglm-dev libvulkan-dev

      - name: Install dependencies (Debian specific)
        if: matrix.container == 'debian:bookworm'
        run: |
          apt-get install -y libomp-23-dev libboost-all-dev qt6-base-dev \
            libbenchmark-dev libhwy-dev libglm-dev libvulkan-dev || true

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ github.job }}-${{ matrix.container }}-${{ matrix.build_type }}-${{ matrix.sanitizer }}

      - name: Configure CMake
        env:
          SAN_FLAG: ${{ matrix.sanitizer != 'none' && format('-fsanitize={0} -fno-omit-frame-pointer', matrix.sanitizer) || '' }}
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_C_COMPILER=/usr/bin/clang-23 \
            -DCMAKE_CXX_COMPILER=/usr/bin/clang++-23 \
            -DCMAKE_LINKER=/usr/bin/lld-23 \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_C_FLAGS="$SAN_FLAG" \
            -DCMAKE_CXX_FLAGS="$SAN_FLAG" \
            -DCMAKE_EXE_LINKER_FLAGS="-fuse-ld=lld $SAN_FLAG" \
            -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Run tests
        run: ctest --test-dir build --output-on-failure --parallel 4